# 发布 Ferry 的部署镜像到 GitHub 的镜像仓库(ghcr.io/tonycc/ferry),服务器上用 install.sh 时直接拉:
#   sudo FERRY_IMAGE=ghcr.io/tonycc/ferry:v2026.11.26 ./install.sh
#
# 推送 v 开头的标签时发布,镜像标签和 git 标签一样(不发 latest:服务器上要写明版本,回退时才知道换回哪个)。
# 也可以在 Actions 页面手动运行,镜像标签是所选的分支名(只用于试验)。
# x86(amd64)和 ARM(arm64)两种架构都构建;gitleaks 在 Dockerfile 里按架构下载并校验。
# 平时的 CI 只构建 x86:第一次打标签发布之前,先在 Actions 页面手动运行一次,确认 ARM 也能构建。
# 先跑一遍 CI(类型检查、测试、镜像能启动),通过了才发布。
# 第三方步骤都锁定到具体提交(这个流程能往镜像仓库推镜像),升级时连同注释里的版本号一起改。
name: Publish image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  # 往 ghcr.io 推镜像;用 Actions 自带的令牌,不需要另外的密钥
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # 在 x86 的机器上构建 arm64 镜像要用 QEMU 模拟
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 镜像名必须小写;标签取 git 标签名(手动运行时是分支名)。
      # 同时写上 org.opencontainers.image.source,ghcr.io 据此把镜像和这个仓库关联起来
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/ferry
          tags: |
            type=ref,event=tag
            type=ref,event=branch

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
