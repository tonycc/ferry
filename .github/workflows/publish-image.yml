# 发布 Ferry 的部署镜像到 GitHub 的镜像仓库(ghcr.io/tonycc/ferry),服务器上用 install.sh 时直接拉:
#   sudo FERRY_IMAGE=ghcr.io/tonycc/ferry:v2026.11.26 ./install.sh
#
# 推送 v 开头的标签时发布,镜像标签和 git 标签一样(不发 latest:服务器上要写明版本,回退时才知道换回哪个)。
# 也可以在 Actions 页面手动运行,镜像标签是所选的分支名(只用于试验)。
# x86(amd64)和 ARM(arm64)两种架构都构建;gitleaks 在 Dockerfile 里按架构下载并校验。
name: Publish image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  # 往 ghcr.io 推镜像;用 Actions 自带的令牌,不需要另外的密钥
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # 在 x86 的机器上构建 arm64 镜像要用 QEMU 模拟
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 镜像名必须小写;标签取 git 标签名(手动运行时是分支名)。
      # 同时写上 org.opencontainers.image.source,ghcr.io 据此把镜像和这个仓库关联起来
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ferry
          tags: |
            type=ref,event=tag
            type=ref,event=branch

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
