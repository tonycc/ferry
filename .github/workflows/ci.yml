# 每次推送到 main 和每个 PR 都跑:类型检查、控制台构建,以及内存存储和 PostgreSQL 存储两套测试。
# 对接本机 Dokploy 的集成测试(pnpm test:dokploy)和网关端到端检查需要一整套 Dokploy,不在 CI 里跑。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 发布镜像前先跑一遍(publish-image.yml)
  workflow_call:

# 同一个分支有新的推送时,取消还在跑的旧检查
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ferry
          POSTGRES_PASSWORD: ferry-ci
          POSTGRES_DB: ferry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ferry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      # README 写的最低版本是 Node.js 22,CI 用它来验证
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # 密钥扫描(任务 3.1)的测试要用真实的 gitleaks;版本和本机 brew 装的一致,校验下载文件
      - name: Install gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      # 控制台(Vue + Element Plus)能构建出来;Ferry 在 /console/ 下提供构建结果
      - run: pnpm --filter @ferry/console build

      # 设置了 TEST_DATABASE_URL 时,存储相关的测试会在内存和 PostgreSQL 上各跑一遍
      - name: Test (in-memory and PostgreSQL)
        run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://ferry:ferry-ci@localhost:5432/ferry
          # 找不到 gitleaks 时让密钥扫描的测试失败,而不是跳过
          GITLEAKS_REQUIRED: "1"

  # Ferry 的部署镜像(任务 3.6)能构建出来,并且能启动
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ferry:ci .
      - name: Start the image and check /healthz
        run: |
          docker run -d --name ferry-ci -p 127.0.0.1:8080:8080 -e PUBLIC_URL=http://127.0.0.1:8080 ferry:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/healthz && exit 0; sleep 1; done
          docker logs ferry-ci
          exit 1
